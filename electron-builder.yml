appId: com.metarolls.app
productName: Meta Rolls
directories:
  buildResources: build
# Allowlist, not a denylist: electron-builder's implicit default is
# "everything not excluded", which previously let dev-only directories
# (.gitnexus, .claude, .agents, .cursor, .pnpm-store, …) into app.asar.
# A custom `files` list replaces electron-builder's automatic node_modules
# inclusion too, so runtime dependencies must be listed explicitly.
files:
  - '!**/*'
  - 'out/**/*'
  - '!out/**/*.map'
  - 'resources/**/*'
  - 'package.json'
  - 'node_modules/**/*'
asarUnpack:
  - resources/**
  - node_modules/exiftool-vendored.*/**/*
win:
  executableName: meta-rolls
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: vhnam2504@gmail.com
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
